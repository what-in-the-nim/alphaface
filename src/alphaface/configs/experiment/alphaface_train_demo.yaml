network: test1
embedding_size: 512
momentum: 0.9
weight_decay: 5e-4
batch_size: 2
init_lr_swapper: 1e-4
init_lr_dis: 1e-4
verbose: 2000
num_epoch: 100000
warmup_epoch: 0
savedir: Save4
src_img_size: 112
tar_img_size: 256
visualize: true
from_scretch: false

optimizer: adamw
db_path: ./custom
tensorboard: false
tb_dir: ./logs/swap_clip
adv_sess: 200000
lr_schedule_step: 20000

# Checkpoint
resume: true
model_path: ./models/vit_b_fr_pgair.pt
output: ./save/save_clip
save_interval: 25000

# Performance
use_amp: true
use_checkpoint: false
num_workers: 8

# Loss weights
w_id: 10.0
w_self_rec: 0.5
w_percept: 0.5
w_2cycle: 0.5
w_mask_rec: 0.5
w_clip_id: 1.0
w_clip_text: 1.0
w_gen_adv: 1.0
