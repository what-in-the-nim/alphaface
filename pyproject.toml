[project]
name = "alphaface"
version = "0.1.0"
description = "AlphaFace face identity swapping model"
readme = "readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pytorch-lightning>=2.0",
    "omegaconf>=2.3",
    "numpy>=1.23",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "tqdm",
    "tensorboard",
    "tensorboardX",
    "pytorch-msssim",
    "lpips",
    "scikit-image",
    "scipy>=1.10",
    "easydict",
    "yacs",
    "openai-clip",
    "wandb",
    "matplotlib",
    "argparse",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "objectives", "dataset", "utils", "backbones", "configs"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
